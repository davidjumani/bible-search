<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bible Search</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 700px;
    margin: 2rem auto;
    padding: 0 1rem;
    background: #1e1e1e;
    color: #ddd;
  }
  a { color: #8ab4f8; }
  input[type="text"] {
    width: 100%;
    padding: 0.5rem;
    font-size: 1rem;
    box-sizing: border-box;
    background: #2a2a2a;
    color: #ddd;
    border: 1px solid #444;
  }
  input[type="text"]::placeholder { color: #888; }
  .flags { margin: 0.75rem 0; display: flex; gap: 1.25rem; flex-wrap: wrap; }
  .flags label { font-size: 0.9rem; }
  #count { color: #999; margin: 0.5rem 0; font-size: 0.9rem; }
  .result { margin-bottom: 1rem; }
  .result.clickable { cursor: pointer; }
  .result.clickable:hover { background: #2a2a2a; }
  .ref { font-weight: bold; color: #eee; }
  .text { margin: 0.15rem 0 0 0; }
  mark { background: #665c1e; color: #ffe08a; }
</style>
</head>
<body>
<h1>Bible Search</h1>
<div class="flags">
  <label>Version:
    <select id="version">
      <option value="NASB">NASB</option>
      <option value="Living">Living</option>
      <option value="Amplified">Amplified</option>
      <option value="Message">Message</option>
    </select>
  </label>
</div>
<div id="loadRow">
  <label>Load file: <input type="file" id="fileInput" accept=".txt"></label>
</div>
<input type="text" id="words" placeholder="e.g. in Him">
<div class="flags">
  <label><input type="checkbox" id="adjacent"> adjacent</label>
  <label><input type="checkbox" id="allowSupersets"> allow supersets</label>
  <label><input type="checkbox" id="caseSensitive"> case sensitive</label>
</div>
<div id="count"></div>
<div id="results"></div>

<script>
const VERSIONS = {
  NASB: { file: "nasb.txt", bgVersion: "NASB" },
  Living: { file: "living.txt", bgVersion: "TLB" },
  Amplified: { file: "amplified.txt", bgVersion: "AMP" },
  Message: { file: "message.txt", bgVersion: "MSG" },
};

let lines = [];

function loadStateFromUrl() {
  const params = new URLSearchParams(window.location.search);
  document.getElementById("words").value = params.get("q") || "";
  document.getElementById("adjacent").checked = params.get("adjacent") === "1";
  document.getElementById("allowSupersets").checked = params.get("supersets") === "1";
  document.getElementById("caseSensitive").checked = params.get("case") === "1";
  const version = params.get("version");
  if (version && VERSIONS[version]) {
    document.getElementById("version").value = version;
  }
}

function updateUrl() {
  const params = new URLSearchParams();
  const words = document.getElementById("words").value;
  if (words) params.set("q", words);
  if (document.getElementById("adjacent").checked) params.set("adjacent", "1");
  if (document.getElementById("allowSupersets").checked) params.set("supersets", "1");
  if (document.getElementById("caseSensitive").checked) params.set("case", "1");
  params.set("version", document.getElementById("version").value);
  const qs = params.toString();
  const url = qs ? `${location.pathname}?${qs}` : location.pathname;
  history.replaceState(null, "", url);
}

loadStateFromUrl();

function setLines(text) {
  lines = text.split(/\r?\n/).filter(l => l.trim() && l.trim() !== ".");
  document.getElementById("loadRow").style.display = "none";
  search();
}

function loadVersion(key) {
  const { file } = VERSIONS[key];
  document.getElementById("loadRow").style.display = "";
  document.getElementById("count").textContent = "";
  // Works when served over http(s). Fails on file:// (browsers block local fetch),
  // in which case the file picker below is used instead.
  fetch(file)
    .then(r => {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    })
    .then(setLines)
    .catch(() => {
      document.getElementById("count").textContent =
        `Could not auto-load ${file} (opened via file://, or file is missing). Pick the file above.`;
    });
}

document.getElementById("version").addEventListener("change", e => {
  updateUrl();
  loadVersion(e.target.value);
});

loadVersion(document.getElementById("version").value);

document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => setLines(reader.result);
  reader.readAsText(file);
});

function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function wordPattern(word, allowSupersets) {
  const exact = escapeRegex(word);
  const upper = escapeRegex(word.toUpperCase());
  const pat = upper !== exact ? `(?:${exact}|${upper})` : exact;
  return allowSupersets ? pat : `\\b${pat}\\b`;
}

function buildPattern(words, adjacent, allowSupersets, caseSensitive) {
  const parts = words.map(w => wordPattern(w, allowSupersets));
  const joiner = adjacent ? "\\s+" : "(?:\\s+\\S+)*?\\s+";
  const flags = caseSensitive ? "" : "i";
  return new RegExp(parts.join(joiner), flags);
}

function titleCase(s) {
  return s.replace(/\w\S*/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase());
}

function chapterUrl(ref) {
  const m = ref.match(/^(.*)\s+(\d+):\d+$/);
  if (!m) return null;
  const book = titleCase(m[1]);
  const chapter = m[2];
  const bgVersion = VERSIONS[document.getElementById("version").value].bgVersion;
  const search = encodeURIComponent(`${book} ${chapter}`);
  return `https://www.biblegateway.com/passage/?search=${search}&version=${bgVersion}`;
}

function search() {
  updateUrl();
  const raw = document.getElementById("words").value.trim();
  const resultsEl = document.getElementById("results");
  const countEl = document.getElementById("count");
  resultsEl.innerHTML = "";

  if (!raw) {
    countEl.textContent = "";
    return;
  }

  const words = raw.split(/\s+/);
  const adjacent = document.getElementById("adjacent").checked;
  const allowSupersets = document.getElementById("allowSupersets").checked;
  const caseSensitive = document.getElementById("caseSensitive").checked;
  const pattern = buildPattern(words, adjacent, allowSupersets, caseSensitive);

  const matches = lines.filter(l => pattern.test(l));
  countEl.textContent = `${matches.length} match(es)`;

  for (const line of matches) {
    const sep = " -- ";
    const idx = line.lastIndexOf(sep);
    const div = document.createElement("div");
    div.className = "result";
    if (idx !== -1) {
      const text = line.slice(0, idx);
      const ref = line.slice(idx + sep.length);
      const refDiv = document.createElement("div");
      refDiv.className = "ref";
      refDiv.textContent = titleCase(ref);
      const textDiv = document.createElement("div");
      textDiv.className = "text";
      textDiv.textContent = text;
      div.appendChild(refDiv);
      div.appendChild(textDiv);

      const url = chapterUrl(ref);
      if (url) {
        div.classList.add("clickable");
        div.addEventListener("click", () => window.open(url, "_blank"));
      }
    } else {
      div.textContent = line;
    }
    resultsEl.appendChild(div);
  }
}

document.getElementById("words").addEventListener("input", search);
document.getElementById("adjacent").addEventListener("change", search);
document.getElementById("allowSupersets").addEventListener("change", search);
document.getElementById("caseSensitive").addEventListener("change", search);
</script>
</body>
</html>
